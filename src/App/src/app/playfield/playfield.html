<div class="playfield" [class.is-dead]="isDead()">
  @for (cell of cells; track cell) {
    <div
      class="cell"
      [class.snake-head]="headIndex() === cell"
      [class.snake-body]="bodyIndices().has(cell)"
      [class.food]="foodIndex() === cell"
      [class.remote-snake]="remoteSegmentColors().has(cell)"
      [style.background-color]="remoteSegmentColors().get(cell) ?? null"
    ></div>
  }
</div>
